[Service]
# MortemHive pre-start checks for mmdvmhost:
# 1. display assert — keeps [General] Display=None so the custom OLED
#    dashboard owns the panel; MMDVMHost can never paint its stock screens
#    over it (best-effort; opts out when the custom dashboard is disabled).
#    See hotspot-display-assert.sh.
# 2. no-transmit guard — refuse to start while the station identity is still
#    a placeholder. See hotspot-config-guard.sh.
# Installed as /etc/systemd/system/mmdvmhost.service.d/10-mortemhive-guard.conf
ExecStartPre=/usr/local/sbin/hotspot-display-assert.sh
ExecStartPre=/usr/local/sbin/hotspot-config-guard.sh
